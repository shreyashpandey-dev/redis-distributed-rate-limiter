version: '3.8'

services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
  app:
    build: .
    container_name: rate-limiter-app
    ports:
      - "8081:8080"
    depends_on:
     - redis
    environment:
      # Spring Boot 4 relaxed binding: SPRING_DATA_REDIS_* -> spring.data.redis.*
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"